services:
  app:
    build: .
    image: dap-sep:latest
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # node-postgres tự đọc các biến PG* này
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Thiếu POSTGRES_DB trong .env}
      PGUSER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
      # Thiếu hoặc mật khẩu < 12 ký tự thì trang admin tự tắt (QT-80)
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Thiếu POSTGRES_DB trong .env}
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Không mở cổng ra ngoài: chỉ app trong mạng compose kết nối được

volumes:
  pgdata:
