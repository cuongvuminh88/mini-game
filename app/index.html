<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đập Chuột</title>
<link rel="stylesheet" href="../design/tokens.css">
<link rel="stylesheet" href="style.css">
<script src="game.js" defer></script>
</head>
<body>

<!-- Hình vẽ dùng chung (QĐ-01): SVG nội tuyến, màu lấy từ biến CSS -->
<svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <!-- Vùng nhìn thấy của chuột: phía trên tâm miệng hang -->
    <clipPath id="mole-clip" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="-20" width="100" height="98"/>
    </clipPath>
    <symbol id="sym-hole" viewBox="0 0 100 100">
      <ellipse class="svg-rim" cx="50" cy="78" rx="42" ry="14"/>
      <ellipse class="svg-hole" cx="50" cy="78" rx="34" ry="9"/>
    </symbol>
    <symbol id="sym-mole" viewBox="0 0 100 100">
      <circle class="svg-ear" cx="30" cy="26" r="9"/>
      <circle class="svg-ear" cx="70" cy="26" r="9"/>
      <path class="svg-body" d="M24 78 V48 a26 26 0 0 1 52 0 V78 Z"/>
      <ellipse class="svg-face" cx="50" cy="58" rx="15" ry="11"/>
      <circle class="svg-eye" cx="41" cy="42" r="3.5"/>
      <circle class="svg-eye" cx="59" cy="42" r="3.5"/>
      <circle class="svg-eye" cx="50" cy="53" r="4"/>
    </symbol>
    <symbol id="sym-mole-hit" viewBox="0 0 100 100">
      <circle class="svg-ear" cx="30" cy="36" r="9"/>
      <circle class="svg-ear" cx="70" cy="36" r="9"/>
      <path class="svg-body" d="M24 78 V58 a26 22 0 0 1 52 0 V78 Z"/>
      <ellipse class="svg-face" cx="50" cy="66" rx="15" ry="9"/>
      <path class="svg-eye-x" d="M37 48 l8 8 M45 48 l-8 8 M55 48 l8 8 M63 48 l-8 8"/>
      <circle class="svg-eye" cx="50" cy="62" r="4"/>
    </symbol>
  </defs>
</svg>

<!-- Mẫu một ô lưới; game.js nhân bản theo GRID_ROWS × GRID_COLS -->
<template id="cell-template">
  <button class="cell" type="button" tabindex="-1">
    <svg class="cell-art" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <use href="#sym-hole"/>
      <g clip-path="url(#mole-clip)">
        <g class="mole">
          <use class="mole-normal" href="#sym-mole"/>
          <use class="mole-hit" href="#sym-mole-hit"/>
        </g>
      </g>
    </svg>
    <span class="plus" aria-hidden="true"></span>
  </button>
</template>

<main class="app">

  <!-- MH-01 · Bắt đầu -->
  <section class="screen screen-start" data-phase="START" aria-labelledby="start-title">
    <svg class="start-art" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <use href="#sym-hole"/>
      <g clip-path="url(#mole-clip)"><use href="#sym-mole"/></g>
    </svg>
    <h1 id="start-title" class="title">Đập Chuột</h1>
    <p class="lead">Bấm trúng chuột để ghi điểm.<br>Bạn có <span id="rule-seconds"></span> giây!</p>
    <p class="body-text">Kỷ lục: <span id="start-best" class="num"></span></p>
    <button id="btn-start" class="btn btn-primary btn-lg" type="button">Bắt đầu</button>
  </section>

  <!-- MH-02 · Đang chơi -->
  <section class="screen screen-play game-area" data-phase="PLAYING" aria-labelledby="play-title" hidden>
    <h2 id="play-title" class="visually-hidden" tabindex="-1">Đang chơi</h2>
    <div class="hud">
      <span>Điểm: <span id="hud-score" class="num"></span></span>
      <span id="hud-time-wrap" class="hud-time">Thời gian: <span id="hud-time" class="num"></span></span>
    </div>
    <div id="grid" class="grid"></div>
  </section>

  <!-- MH-03 · Kết thúc -->
  <section class="screen screen-end" data-phase="END" aria-labelledby="end-title" hidden>
    <h2 id="end-title" class="title">Hết giờ!</h2>
    <p class="label">Điểm của bạn</p>
    <p id="end-score" class="big-num num"></p>
    <p class="body-text">Trúng <span id="end-hits" class="num"></span> / <span id="end-spawned" class="num"></span> con chuột</p>
    <p id="end-new-record" class="badge-new" hidden>Kỷ lục mới!</p>
    <p class="body-text">Kỷ lục: <span id="end-best" class="num"></span></p>
    <button id="btn-replay" class="btn btn-primary btn-lg" type="button">Chơi lại</button>
  </section>

  <!-- Vùng đọc kết quả cho trình đọc màn hình (không đọc từng giây) -->
  <div id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

</main>
</body>
</html>
