<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Đăng nhập quản trị — Đập Sếp</title>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/admin/admin.css">
<script src="/admin/login.js" defer></script>
</head>
<body class="login-page">
<main class="card login-card">
  <!-- MH-10 · Đăng nhập admin (CN-17) -->
  <h1>Quản trị</h1>
  <p class="muted">Đăng nhập để xem danh sách người chơi.</p>
  <form id="login-form" novalidate>
    <div class="field">
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p id="login-error" class="form-error" role="alert"></p>
    <button id="btn-login" class="btn btn-primary btn-block" type="submit">Đăng nhập</button>
  </form>
</main>
</body>
</html>
